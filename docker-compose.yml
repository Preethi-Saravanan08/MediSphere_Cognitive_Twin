version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: medisphere-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb-data:/data/db
    networks:
      - medisphere-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: medisphere-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - medisphere-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: medisphere-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    networks:
      - medisphere-network

  medisphere:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medisphere-app
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@mongodb:27017/medisphere?authSource=admin
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FHIR_SERVER_URL: http://localhost:8081/fhir
      AUDIT_ENABLED: "true"
    networks:
      - medisphere-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/v1/health/status" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:

networks:
  medisphere-network:
    driver: bridge
